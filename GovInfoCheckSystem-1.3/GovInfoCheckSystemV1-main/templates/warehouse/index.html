{% extends 'base.html' %}
{% block content %}
<style>
    /* 优化表格显示：单行省略，防止错位 */
    .layui-table-cell {
        height: 40px !important;
        line-height: 40px !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 10px;
    }
    
    /* 修复复选框垂直对齐 */
    .layui-table-cell .layui-form-checkbox {
        top: 0px;
    }

    /* 调整徽章间距 */
    .layui-badge {
        margin-top: 4px;
        display: inline-block;
    }
</style>
<div class="layui-card">
  <div class="layui-card-header">
    <span class="layui-breadcrumb">
      <a href="/">首页</a>
      <a><cite>数据仓库</cite></a>
    </span>
  </div>
  <div class="layui-card-body">
    <!-- Search Toolbar -->
    <div class="layui-form layui-row layui-col-space15" style="padding-bottom: 15px;">
      <div class="layui-col-md4">
        <div class="layui-input-group">
          <div class="layui-input-prefix">
            <i class="layui-icon layui-icon-search"></i>
          </div>
          <input type="text" id="search-keyword" placeholder="搜索标题或关键词" class="layui-input">
          <div class="layui-input-split layui-input-suffix" style="cursor: pointer;" id="do-search">
            搜索
          </div>
        </div>
      </div>
      <div class="layui-col-md8" style="text-align: right;">
        <button class="layui-btn layui-btn-warm" id="manage-sources">
          <i class="layui-icon layui-icon-set"></i> 来源规则管理
        </button>
        <button class="layui-btn layui-btn-normal" id="smart-sniff" style="background-color: #1E9FFF;">
          <i class="layui-icon layui-icon-find-fill"></i> 智能嗅探
        </button>
        <button class="layui-btn" id="auto-bind-rules" style="background-color: #5FB878;">
          <i class="layui-icon layui-icon-link"></i> 一键自动关联
        </button>
        <button class="layui-btn layui-btn-normal" id="batch-crawl">
          <i class="layui-icon layui-icon-engine"></i> 深度采集
        </button>
        <button class="layui-btn layui-btn-danger" id="batch-delete">
          <i class="layui-icon layui-icon-delete"></i> 批量删除
        </button>
      </div>
    </div>

    <!-- Data Table -->
    <table id="data-table" lay-filter="data-table"></table>
  </div>
</div>

<!-- Action Bar Template -->
<script type="text/html" id="table-bar">
  <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="preview">预览</a>
  <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="crawl">采集</a>
  <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="sniff">嗅探</a>
  <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
  <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<!-- Preview Modal Template -->
<div id="preview-modal" style="display: none; padding: 20px;">
  <div class="layui-card" style="box-shadow: none;">
    <div class="layui-card-header" id="preview-title" style="font-weight: bold; font-size: 18px; line-height: 1.4; height: auto; padding: 10px 0; border-bottom: 1px solid #eee;"></div>
    <div class="layui-card-body">
      <div style="margin-bottom: 15px; color: #999; font-size: 12px;">
        来源：<span id="preview-source"></span> &nbsp;&nbsp;|&nbsp;&nbsp;
        链接：<a id="preview-url" href="#" target="_blank" style="color: #1E9FFF;">点击跳转原文</a>
      </div>
      <div id="preview-content" style="white-space: pre-wrap; line-height: 1.8; padding: 10px 0; font-size: 14px; color: #333; text-align: justify;"></div>
    </div>
  </div>
</div>

<!-- Edit Modal Template -->
<div id="edit-modal" style="display: none; padding: 20px;">
  <form class="layui-form" lay-filter="edit-form">
    <input type="hidden" name="id">
    <div class="layui-form-item">
      <label class="layui-form-label">标题</label>
      <div class="layui-input-block">
        <input type="text" name="title" required  lay-verify="required" placeholder="请输入标题" autocomplete="off" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item layui-form-text">
      <label class="layui-form-label">摘要</label>
      <div class="layui-input-block">
        <textarea name="deep_summary" placeholder="请输入内容" class="layui-textarea" rows="10"></textarea>
      </div>
    </div>
    <div class="layui-form-item" style="text-align: right;">
      <button class="layui-btn" lay-submit lay-filter="save-edit">保存</button>
    </div>
  </form>
</div>

<!-- Source Manager Modal -->
<div id="source-modal" style="display: none; padding: 20px; background-color: #f2f2f2;">
  <div class="layui-row layui-col-space15">
    <div class="layui-col-md4">
      <div class="layui-card">
        <div class="layui-card-header">
            来源列表
            <div style="float: right;">
                <button class="layui-btn layui-btn-xs layui-btn-primary" id="select-all-sources">全选/取消</button>
            </div>
        </div>
        <div style="padding: 10px 15px; border-bottom: 1px solid #f6f6f6;">
            <div class="layui-row layui-col-space5">
                <div class="layui-col-md9">
                    <input type="text" id="source-search-keyword" placeholder="搜索来源或域名" class="layui-input" style="height: 30px; line-height: 30px;">
                </div>
                <div class="layui-col-md3">
                    <button class="layui-btn layui-btn-sm layui-btn-primary layui-border-blue" id="source-search-btn" style="width: 100%;">搜索</button>
                </div>
            </div>
        </div>
        <div class="layui-card-body" style="height: 400px; overflow-y: auto; padding: 0;">
          <ul class="layui-menu" id="source-list" style="background: #fff;">
            <!-- Sources will be loaded here -->
          </ul>
        </div>
      </div>
    </div>
    <div class="layui-col-md8">
      <div class="layui-card">
        <div class="layui-card-header">绑定规则 <span id="current-source" style="color: #FF5722; font-weight: bold;"></span></div>
        <div class="layui-card-body" style="height: 400px; overflow-y: auto;">
          <form class="layui-form" id="rule-bind-form" lay-filter="rule-bind-form">
            <div id="rule-list">
              <div style="color: #999; padding: 20px; text-align: center;">请先选择左侧来源</div>
            </div>
            <div class="layui-form-item" style="margin-top: 20px; text-align: right; display: none;" id="bind-btn-area">
              <button class="layui-btn" type="button" id="save-binding">保存绑定</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Smart Sniff Modal -->
<div id="sniff-modal" style="display: none; padding: 20px;">
  <div class="layui-form">
    <div class="layui-form-item">
      <label class="layui-form-label">目标URL</label>
      <div class="layui-input-block">
        <input type="text" id="sniff-url" placeholder="请输入需要分析的目标详情页URL" autocomplete="off" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item" style="text-align: right;">
      <button class="layui-btn" id="do-sniff">开始分析</button>
    </div>
  </div>
  
  <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
    <legend>分析结果</legend>
  </fieldset>
  
  <div class="layui-form" lay-filter="sniff-result-form">
    <!-- Hidden field to store full headers data -->
    <input type="hidden" name="headers_json" id="sniff-headers-json">
    
    <div class="layui-form-item">
      <label class="layui-form-label">站点名称</label>
      <div class="layui-input-block">
        <input type="text" name="site_name" class="layui-input" placeholder="自动获取或手动输入">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">站点域名</label>
      <div class="layui-input-block">
        <input type="text" name="domain" class="layui-input" placeholder="自动获取">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">标题XPath</label>
      <div class="layui-input-block">
        <input type="text" name="title_xpath" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">内容XPath</label>
      <div class="layui-input-block">
        <input type="text" name="content_xpath" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <button class="layui-btn layui-btn-normal" type="button" id="save-sniffed-rule">
                <i class="layui-icon layui-icon-release"></i> 保存为新规则
            </button>
        </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
layui.use(['table', 'form', 'layer'], function(){
  var table = layui.table;
  var form = layui.form;
  var layer = layui.layer;
  var $ = layui.$;

  // Render Table
  var tableIns = table.render({
    elem: '#data-table',
    url: '/warehouse/api/list',
    page: true,
    cols: [[
      {type: 'checkbox', fixed: 'left'},
      {field: 'id', title: 'ID', width: 60, sort: true},
      {field: 'title', title: '标题', minWidth: 300, templet: function(d){
        return '<a href="'+(d.url||'#')+'" target="_blank" class="layui-table-link">'+d.title+'</a>';
      }},
      {field: 'source', title: '来源|域名|关联规则', width: 300, templet: function(d){
          var html = '<div style="font-weight: bold;">' + d.source ;
          if(d.domain){
              html += '|' + d.domain + '';
          }
          if(d.bound_rules && d.bound_rules.length > 0){
              html += '|<span class="layui-badge layui-bg-orange" title="已关联规则: '+d.bound_rules.join(', ')+'">'+d.bound_rules.join(', ')+'</span>';
          }
          html+='</div>';
          return html;
      }},
      {field: 'deep_crawled', title: '深采', width: 60, templet: function(d){
        return d.deep_crawled ? '<span class="layui-badge layui-bg-green">是</span>' : '<span class="layui-badge layui-bg-gray">否</span>';
      }},
      {field: 'created_at', title: '采集时间', width: 180, sort: true},
      {fixed: 'right', title:'操作', toolbar: '#table-bar', width: 280}
    ]]
  });

  // Search
  $('#do-search').on('click', function(){
    var keyword = $('#search-keyword').val();
    tableIns.reload({
      where: {keyword: keyword},
      page: {curr: 1}
    });
  });

  // Batch Delete
  $('#batch-delete').on('click', function(){
    var checkStatus = table.checkStatus('data-table');
    var data = checkStatus.data;
    if(data.length === 0){
      layer.msg('请选择要删除的数据');
      return;
    }
    var ids = data.map(function(item){return item.id;});
    
    layer.confirm('确认删除选中的 ' + data.length + ' 条数据吗？', function(index){
      $.ajax({
        url: '/warehouse/api/delete',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ids: ids}),
        success: function(res){
          if(res.code === 0){
            layer.msg('删除成功');
            tableIns.reload();
          } else {
            layer.msg(res.msg || '删除失败', {icon: 2});
          }
        }
      });
      layer.close(index);
    });
  });

  // Smart Sniff
  $('#smart-sniff').on('click', function(){
    layer.open({
      type: 1,
      title: '智能采集规则嗅探',
      area: ['600px', '500px'],
      content: $('#sniff-modal'),
      success: function(){
        $('#sniff-url').val('');
        form.val('sniff-result-form', {
            'title_xpath': '',
            'content_xpath': ''
        });
      }
    });
  });
  
  $('#do-sniff').on('click', function(){
      var url = $('#sniff-url').val();
      if(!url){
          layer.msg('请输入URL');
          return;
      }
      
      var loadIndex = layer.load(2);
      $.ajax({
          url: '/warehouse/api/smart_sniff',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({url: url}),
          success: function(res){
              layer.close(loadIndex);
              if(res.code === 0){
                  layer.msg('分析成功');
                  
                  // Store headers
                  var headers = res.data.headers || {};
                  $('#sniff-headers-json').val(JSON.stringify(headers));
                  
                  form.val('sniff-result-form', {
                      'site_name': res.data.site_name || '',
                      'domain': res.data.domain || '',
                      'title_xpath': res.data.title_xpath || '未找到',
                      'content_xpath': res.data.content_xpath || '未找到'
                  });
              } else {
                  layer.msg(res.msg || '分析失败', {icon: 2});
              }
          },
          error: function(){
              layer.close(loadIndex);
              layer.msg('请求失败', {icon: 2});
          }
      });
  });

  // Save Sniffed Rule
  $('#save-sniffed-rule').on('click', function(){
      var data = form.val('sniff-result-form');
      if(!data.site_name){
          layer.msg('请输入站点名称');
          return;
      }
      if(!data.title_xpath || !data.content_xpath){
          layer.msg('XPath信息不完整');
          return;
      }
      
      var payload = {
          site_name: data.site_name,
          domain: data.domain,
          title_xpath: data.title_xpath,
          content_xpath: data.content_xpath,
          headers: $('#sniff-headers-json').val()
      };
      
      var loading = layer.load(1);
      $.ajax({
          url: '/rules/api/add',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(payload),
          success: function(res){
              layer.close(loading);
              if(res.code === 0){
                  layer.msg('规则已保存', {icon: 1});
                  layer.closeAll('page'); // Close sniffer modal
                  // Refresh rules if needed, or maybe just stay.
                  // But we should probably ask user if they want to bind this rule? 
                  // For now, simple save is requested.
              } else {
                  layer.msg('保存失败: ' + res.msg, {icon: 2});
              }
          },
          error: function(){
              layer.close(loading);
              layer.msg('请求失败', {icon: 2});
          }
      });
  });

  
  // Batch Deep Crawl
  $('#batch-crawl').on('click', function(){
    var checkStatus = table.checkStatus('data-table');
    var data = checkStatus.data;
    if(data.length === 0){
      layer.msg('请选择要采集的数据');
      return;
    }
    var ids = data.map(function(item){return item.id;});
    
    var loading = layer.load(1);
    $.ajax({
      url: '/warehouse/api/deep_crawl',
      type: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ids: ids}),
      success: function(res){
        layer.close(loading);
        if(res.code === 0){
          layer.msg(res.msg, {icon: 1});
          tableIns.reload();
        } else {
          layer.alert(res.msg + (res.errors ? '<br>' + res.errors.join('<br>') : ''), {icon: 2, title: '采集失败'});
        }
      },
      error: function(){
        layer.close(loading);
        layer.msg('请求失败', {icon: 2});
      }
    });
  });

  // Auto Bind Rules
  $('#auto-bind-rules').on('click', function(){
    layer.confirm('将自动检测来源与规则的匹配性（域名+名称），并自动建立关联。<br>确定要继续吗？', function(index){
      var loading = layer.load(1);
      $.ajax({
        url: '/warehouse/api/auto_bind',
        type: 'POST',
        success: function(res){
          layer.close(loading);
          if(res.code === 0){
            layer.msg(res.msg, {icon: 1});
            tableIns.reload();
          } else {
            layer.msg('操作失败: ' + res.msg, {icon: 2});
          }
        },
        error: function(){
          layer.close(loading);
          layer.msg('请求失败', {icon: 2});
        }
      });
      layer.close(index);
    });
  });

  // Manage Sources
  $('#manage-sources').on('click', function(){
    layer.open({
      type: 1,
      title: '来源规则管理',
      area: ['900px', '600px'],
      content: $('#source-modal'),
      success: function(){
        loadSources();
        loadRules();
      }
    });
  });
  
  // Source Search
  $('#source-search-btn').on('click', function(){
      loadSources($('#source-search-keyword').val());
  });
  $('#source-search-keyword').on('keyup', function(e){
      if(e.keyCode === 13){
          loadSources($(this).val());
      }
  });
  
  var allRules = [];
  
  function loadSources(keyword){
    var loadIndex = layer.load(2, {shade: 0.1, time: 2000});
    $.get('/warehouse/api/sources?keyword=' + (keyword || ''), function(res){
      layer.close(loadIndex);
      if(res.code === 0){
        var html = '';
        if(res.data.length === 0){
            html = '<li style="padding:15px; text-align:center; color:#999;">无匹配来源</li>';
        }
        res.data.forEach(function(item){
          var safeSrc = item.source.replace(/'/g, "&#39;");
          var domain = item.domain || '';
          var boundCount = item.bound_count || 0;
          var isBound = boundCount > 0;
          // Highlight bound sources with a left border or background hint
          var boundStyle = isBound ? 'border-left: 3px solid #5FB878; background-color: #fafffa;' : 'border-left: 3px solid transparent;';
          
          html += '<li class="source-item" data-source="'+safeSrc+'" data-domain="'+domain+'" data-bound-count="'+boundCount+'" style="cursor: pointer; padding: 10px 15px; border-bottom: 1px solid #eee; '+boundStyle+'">';
          html += '<div style="display: flex; align-items: center;">';
          html += '<div style="width: 30px;"><i class="layui-icon layui-icon-ok-circle check-icon" style="font-size: 18px; color: #ddd;"></i></div>';
          html += '<div style="flex: 1;">';
          html += '<div style="font-weight: bold;">' + item.source;
          if(boundCount > 0){
             html += ' <span class="layui-badge layui-bg-green" style="margin-left: 5px;">'+boundCount+'</span>';
          }
          html += '</div>';
          if(domain){
             html += '<div style="color:#999; font-size:12px;">' + domain + '</div>';
          }
          html += '</div></div></li>';
        });
        $('#source-list').html(html);
        
        // Handle click selection
        $('#source-list li').on('click', function(){
            $(this).toggleClass('selected');
            var icon = $(this).find('.check-icon');
            if($(this).hasClass('selected')){
                $(this).css('background-color', '#f0f9eb');
                icon.removeClass('layui-icon-ok-circle').addClass('layui-icon-success').css('color', '#5FB878');
            } else {
                var boundCount = parseInt($(this).data('bound-count') || 0);
                var isBound = boundCount > 0;
                // Reset background based on bound status
                $(this).css('background-color', isBound ? '#fafffa' : '#fff');
                icon.removeClass('layui-icon-success').addClass('layui-icon-ok-circle').css('color', '#ddd');
            }
            updateSelectionUI();
        });
      }
    });
  }

  // Select All Sources Logic
  $(document).on('click', '#select-all-sources', function(){
      var items = $('#source-list li.source-item');
      if(items.length === 0) return;
      
      var selectedItems = items.filter('.selected');
      var isAllSelected = items.length === selectedItems.length;
      
      if(isAllSelected){
          // Deselect all
          items.removeClass('selected');
          items.each(function(){
              var icon = $(this).find('.check-icon');
              var boundCount = parseInt($(this).data('bound-count') || 0);
              var isBound = boundCount > 0;
              $(this).css('background-color', isBound ? '#fafffa' : '#fff');
              icon.removeClass('layui-icon-success').addClass('layui-icon-ok-circle').css('color', '#ddd');
          });
      } else {
          // Select all
          items.addClass('selected');
          items.css('background-color', '#f0f9eb');
          items.find('.check-icon').removeClass('layui-icon-ok-circle').addClass('layui-icon-success').css('color', '#5FB878');
      }
      updateSelectionUI();
  });
  
  function updateSelectionUI(){
      var selected = $('#source-list li.selected');
      var count = selected.length;
      
      if(count === 0){
          $('#current-source').text('');
          $('#bind-btn-area').hide();
          $('#rule-list').html('<div style="color: #999; padding: 20px; text-align: center;">请先选择左侧来源</div>');
          return;
      }
      
      if(count === 1){
          var li = selected.first();
          var source = li.data('source');
          var domain = li.data('domain');
          $('#current-source').text(source + (domain ? ' ('+domain+')' : ''));
          $('#bind-btn-area').show();
          
          // Fetch bound rules for single selection
          $.ajax({
            url: '/warehouse/api/source_rules',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({source: source, domain: domain}),
            success: function(res){
                var boundIds = res.code === 0 ? res.data : [];
                renderRules(boundIds);
            }
          });
      } else {
          $('#current-source').text('批量选择 ' + count + ' 个来源');
          $('#bind-btn-area').show();
          // Batch mode: Show clean slate (or could show intersection, but clean is safer for "set new rules")
          renderRules([]);
      }
  }
  
  function loadRules(){
    $.get('/rules/api/list?limit=1000', function(res){
      if(res.code === 0){
        allRules = res.data;
      }
    });
  }
  
  function renderRules(boundIds){
      var html = '';
      if(allRules.length === 0){
          html = '<div style="padding: 20px;">暂无规则，请先去规则库添加</div>';
      } else {
          allRules.forEach(function(rule){
              var checked = boundIds.includes(rule.id) ? 'checked' : '';
              html += '<div class="layui-col-md12" style="padding: 5px;">';
              html += '<input type="checkbox" name="rules[]" value="'+rule.id+'" title="'+rule.site_name+' ('+ (rule.domain||'-') +')" lay-skin="primary" '+checked+'>';
              html += '</div>';
          });
      }
      $('#rule-list').html('<div class="layui-row">' + html + '</div>');
      form.render('checkbox', 'rule-bind-form');
  }
  
  $('#save-binding').on('click', function(){
      var selected = $('#source-list li.selected');
      if(selected.length === 0) return;
      
      var sources = [];
      selected.each(function(){
          sources.push({
              source: $(this).data('source'),
              domain: $(this).data('domain')
          });
      });
      
      var ruleIds = [];
      $('#rule-list input[type="checkbox"]:checked').each(function(){
          ruleIds.push(parseInt($(this).val()));
      });
      
      var loading = layer.load(1);
      $.ajax({
          url: '/warehouse/api/bind_source',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({sources: sources, rule_ids: ruleIds}),
          success: function(res){
              layer.close(loading);
              if(res.code === 0){
                  layer.msg('绑定成功', {icon: 1});
                  // Refresh source list to update bound status
                  loadSources($('#source-search-keyword').val());
                  // Also refresh main table
                  tableIns.reload();
              } else {
                  layer.msg('绑定失败: ' + res.msg, {icon: 2});
              }
          },
          error: function(){
              layer.close(loading);
              layer.msg('请求失败', {icon: 2});
          }
      });
  });

  // Tool Events
  table.on('tool(data-table)', function(obj){
    var data = obj.data;
    var layEvent = obj.event;

    if(layEvent === 'del'){
      layer.confirm('真的删除行么', function(index){
        $.ajax({
          url: '/warehouse/api/delete',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ids: [data.id]}),
          success: function(res){
            if(res.code === 0){
              obj.del();
              layer.msg('删除成功', {icon: 1});
            } else {
              layer.msg('删除失败: ' + res.msg, {icon: 2});
            }
          }
        });
        layer.close(index);
      });
    } else if(layEvent === 'preview'){
      if(!data.deep_crawled){
        layer.msg('该条目尚未进行深度采集，无法预览内容', {icon: 0});
        return;
      }
      
      var loadIndex = layer.load(1);
      $.ajax({
        url: '/warehouse/api/detail/' + data.id,
        type: 'GET',
        success: function(res){
          layer.close(loadIndex);
          if(res.code === 0){
            $('#preview-title').text(res.data.title || data.title);
            $('#preview-source').text(data.source);
            $('#preview-url').attr('href', data.url);
            $('#preview-content').text(res.data.content || '暂无内容');
            
            layer.open({
              type: 1,
              title: '内容预览',
              area: ['800px', '600px'],
              content: $('#preview-modal'),
              shadeClose: true
            });
          } else {
            layer.msg('获取详情失败: ' + res.msg, {icon: 2});
          }
        },
        error: function(){
          layer.close(loadIndex);
          layer.msg('网络请求失败', {icon: 2});
        }
      });
    } else if(layEvent === 'crawl'){
      // Single Crawl
      var loading = layer.load(1);
      $.ajax({
        url: '/warehouse/api/deep_crawl',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ids: [data.id]}),
        success: function(res){
          layer.close(loading);
          if(res.code === 0){
            layer.msg(res.msg, {icon: 1});
            tableIns.reload();
          } else {
            layer.msg('采集失败: ' + res.msg, {icon: 2});
          }
        }
      });
    } else if(layEvent === 'sniff'){
      layer.open({
        type: 1,
        title: '智能采集规则嗅探',
        area: ['600px', '500px'],
        content: $('#sniff-modal'),
        success: function(){
          $('#sniff-url').val(data.url);
          form.val('sniff-result-form', {
              'title_xpath': '',
              'content_xpath': ''
          });
        }
      });
    } else if(layEvent === 'edit'){
      // ... existing edit logic ...
      form.val('edit-form', data);
      layer.open({
        type: 1,
        title: '编辑条目',
        area: ['500px', '400px'],
        content: $('#edit-modal')
      });
    }
  });

  // Save Edit
  form.on('submit(save-edit)', function(data){
    $.ajax({
      url: '/warehouse/api/update',
      type: 'POST',
      contentType: 'application/json',
      data: JSON.stringify(data.field),
      success: function(res){
        if(res.code === 0){
          layer.closeAll('page');
          layer.msg('更新成功', {icon: 1});
          tableIns.reload();
        } else {
          layer.msg('更新失败: ' + res.msg, {icon: 2});
        }
      }
    });
    return false;
  });

});
</script>
{% endblock %}
