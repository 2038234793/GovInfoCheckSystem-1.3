{% extends "base.html" %}

{% block content %}
<div class="layui-card">
    <div class="layui-card-header">
        报告管理
        <div style="float: right;">
            <a href="{{ url_for('report_mgmt.generate') }}" class="layui-btn layui-btn-sm">生成报告</a>
        </div>
    </div>
    <div class="layui-card-body">
        <form class="layui-form" style="margin-bottom: 20px;">
            <div class="layui-inline">
                <input type="text" name="industry" placeholder="输入行业筛选" class="layui-input">
            </div>
            <button class="layui-btn layui-btn-primary" lay-submit lay-filter="search">搜索</button>
        </form>
        
        <table id="report-table" lay-filter="report-table"></table>
    </div>
</div>

<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-xs" lay-event="view">查看</a>
    <!-- Use lay-event for download to handle URL generation in JS -->
    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="download">下载PDF</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>
{% endblock %}

{% block scripts %}
<script>
layui.use(['table', 'form', 'layer'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.$;
    
    table.render({
        elem: '#report-table',
        url: '/report_mgmt/api/list',
        cols: [[
            {field: 'id', title: 'ID', width: 80, sort: true},
            {field: 'title', title: '报告标题'},
            {field: 'industry', title: '行业', width: 120},
            {field: 'time_range', title: '时间范围', width: 200},
            {field: 'author', title: '生成人', width: 100},
            {field: 'created_at', title: '生成时间', width: 180, sort: true},
            {fixed: 'right', title:'操作', toolbar: '#barDemo', width: 220}
        ]],
        page: true
    });
    
    // Search
    form.on('submit(search)', function(data){
        table.reload('report-table', {
            where: data.field,
            page: { curr: 1 }
        });
        return false;
    });
    
    // Tools
    table.on('tool(report-table)', function(obj){
        var data = obj.data;
        if(obj.event === 'del'){
            layer.confirm('真的删除行么', function(index){
                $.ajax({
                    url: '/report_mgmt/api/delete',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({id: data.id}),
                    success: function(res){
                        if(res.code === 0){
                            obj.del();
                            layer.close(index);
                        } else {
                            layer.msg(res.msg);
                        }
                    }
                });
            });
        } else if(obj.event === 'view'){
            window.location.href = '/report_mgmt/view/' + data.id;
        } else if(obj.event === 'download'){
            // Manually trigger download
            window.open('/report_mgmt/download/' + data.id, '_blank');
        }
    });
});
</script>
{% endblock %}
