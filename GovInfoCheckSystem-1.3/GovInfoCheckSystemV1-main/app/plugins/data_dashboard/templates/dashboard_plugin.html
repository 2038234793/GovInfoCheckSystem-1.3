<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政务舆情数据大屏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
    <!-- ECharts GL for 3D -->
    <script src="{{ url_for('static', filename='js/echarts-gl.min.js') }}"></script>
    <!-- China Map -->
    <script src="{{ url_for('static', filename='js/china.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('chatroom.static', filename='css/all.min.css') }}">
    <style>
        body {
            background-color: #0b0e17;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
        .chart-container {
            width: 100%;
            height: 100%;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0e17;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-y-auto">
    <!-- Header -->
    <header class="h-16 flex-none flex items-center justify-between px-6 border-b border-gray-800 bg-opacity-50 bg-black">
        <div class="flex items-center space-x-4">
            <i class="fas fa-chart-line text-blue-500 text-2xl"></i>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                政务舆情智能监测大屏
            </h1>
        </div>
        <div class="flex items-center space-x-4">
            <div id="clock" class="text-gray-400 font-mono text-lg"></div>
            <a href="/" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm transition-colors">
                返回系统
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 grid grid-cols-12 gap-4 min-h-[800px]">
        
        <!-- Left Column (Charts) -->
        <div class="col-span-3 flex flex-col gap-4 h-full">
            <!-- Pie Chart -->
            <div class="glass-panel flex-1 p-4 flex flex-col relative">
                <h3 class="text-lg font-semibold mb-2 flex items-center">
                    <i class="fas fa-chart-pie mr-2 text-purple-400"></i> 来源分布
                </h3>
                <div id="pieChart" class="flex-1 chart-container"></div>
            </div>
            <!-- Bar Chart -->
            <div class="glass-panel flex-1 p-4 flex flex-col relative">
                <h3 class="text-lg font-semibold mb-2 flex items-center">
                    <i class="fas fa-chart-bar mr-2 text-green-400"></i> 采集趋势 (近7天)
                </h3>
                <div id="barChart" class="flex-1 chart-container"></div>
            </div>
        </div>

        <!-- Center Column (Map) -->
        <div class="col-span-6 flex flex-col gap-4 h-full">
            <div class="glass-panel flex-1 p-1 relative">
                <!-- Map Controls -->
                <div class="absolute top-4 left-4 z-10 flex space-x-2">
                    <button onclick="switchMap('2d')" class="px-3 py-1 bg-blue-600/50 hover:bg-blue-600 rounded text-xs border border-blue-400">2D 地图</button>
                    <button onclick="switchMap('3d')" class="px-3 py-1 bg-purple-600/50 hover:bg-purple-600 rounded text-xs border border-purple-400">3D 地球</button>
                </div>
                
                <div id="mapContainer" class="w-full h-full rounded-lg overflow-hidden"></div>
            </div>
            
            <!-- Stats Cards -->
            <div class="h-24 grid grid-cols-4 gap-4">
                <div class="glass-panel flex flex-col items-center justify-center p-2">
                    <span class="text-gray-400 text-sm">总采集量</span>
                    <span id="stat-total" class="text-2xl font-bold text-blue-400">-</span>
                </div>
                <div class="glass-panel flex flex-col items-center justify-center p-2">
                    <span class="text-gray-400 text-sm">今日新增</span>
                    <span id="stat-today" class="text-2xl font-bold text-green-400">-</span>
                </div>
                <div class="glass-panel flex flex-col items-center justify-center p-2">
                    <span class="text-gray-400 text-sm">预警信息</span>
                    <span id="stat-warning" class="text-2xl font-bold text-red-400">-</span>
                </div>
                <div class="glass-panel flex flex-col items-center justify-center p-2">
                    <span class="text-gray-400 text-sm">覆盖省份</span>
                    <span id="stat-provinces" class="text-2xl font-bold text-yellow-400">-</span>
                </div>
            </div>
        </div>

        <!-- Right Column (List & AI) -->
        <div class="col-span-3 flex flex-col gap-4 h-full">
            <!-- List -->
            <div class="glass-panel col-span-2 p-4 flex flex-col relative overflow-hidden">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-lg font-semibold flex items-center">
                        <i class="fas fa-newspaper mr-2 text-blue-400"></i> 实时资讯
                    </h3>
                    <button onclick="refreshNews()" id="refresh-news-btn" class="text-xs px-2 py-1 bg-blue-600/30 hover:bg-blue-600 rounded text-blue-300 border border-blue-500/50 transition-colors flex items-center gap-1">
                        <i class="fas fa-sync-alt"></i> 刷新
                    </button>
                </div>
                <div id="news-scroll-container" class="flex-1 overflow-hidden relative">
                    <div id="newsList" class="absolute w-full top-0 left-0">
                        <!-- Items -->
                    </div>
                </div>
            </div>

            <!-- AI Analysis -->
            <div class="glass-panel h-1/2 p-4 flex flex-col">
                <div class="flex flex-col gap-2 mb-2">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-semibold flex items-center">
                            <i class="fas fa-robot mr-2 text-pink-400"></i> AI 舆情简报
                        </h3>
                        <button id="refresh-ai" class="text-xs px-2 py-1 bg-pink-600 hover:bg-pink-700 rounded animate-pulse transition-colors">
                            生成报告
                        </button>
                    </div>
                    <div class="relative">
                        <input type="text" id="ai-keyword" placeholder="输入关键词以生成特定简报..." 
                               class="w-full bg-black/20 border border-pink-500/30 rounded px-3 py-1 text-sm text-gray-200 focus:outline-none focus:border-pink-500 transition-colors placeholder-gray-600">
                        <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
                    </div>
                </div>
                <div id="ai-content" class="flex-1 overflow-y-auto text-sm text-gray-300 leading-relaxed p-2 bg-black/20 rounded">
                    <div class="flex items-center justify-center h-full text-gray-500 text-center">
                        <div class="flex flex-col gap-2">
                            <i class="fas fa-brain text-2xl opacity-50"></i>
                            <span>输入关键词并点击"生成报告"<br>获取AI智能分析</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- News Detail Modal -->
    <div id="news-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-blue-500/30 rounded-xl w-full max-w-2xl max-h-[80vh] flex flex-col shadow-2xl shadow-blue-900/20">
            <div class="p-4 border-b border-white/10 flex justify-between items-center">
                <h3 class="text-xl font-bold text-white truncate pr-4" id="modal-title">News Title</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white transition">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <div class="flex items-center text-sm text-gray-400 mb-4 space-x-4">
                    <span class="bg-blue-900/30 text-blue-300 px-2 py-1 rounded" id="modal-source">Source</span>
                    <span id="modal-time">Time</span>
                    <a href="#" target="_blank" id="modal-link" class="text-blue-400 hover:text-blue-300 hover:underline flex items-center">
                        <i class="fas fa-external-link-alt mr-1"></i> 原文链接
                    </a>
                </div>
                <div class="prose prose-invert max-w-none text-gray-300 leading-relaxed" id="modal-content">
                    <!-- Content -->
                </div>
            </div>
            <div class="p-4 border-t border-white/10 bg-gray-800/50 rounded-b-xl flex justify-end">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded text-white text-sm transition">关闭</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('data_dashboard.static', filename='js/dashboard.js') }}"></script>
</body>
</html>
