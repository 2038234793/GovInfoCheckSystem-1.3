<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线聊天</title>
    <script src="{{ url_for('chatroom.static', filename='js/tailwindcss.js') }}"></script>
    <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
    <link href="{{ url_for('chatroom.static', filename='css/all.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('chatroom.static', filename='js/socket.io.min.js') }}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F4C81',
                        secondary: '#1A3A5F',
                        dark: '#121212',
                        card: '#1E1E2E',
                        'card-hover': '#2A2A40',
                        accent: '#00A3FF',
                        success: '#00C48C',
                        warning: '#FF9500',
                        danger: '#FF3B30',
                        muted: '#6E7681'
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .scrollbar-thin {
                scrollbar-width: thin;
            }
            .scrollbar-thin::-webkit-scrollbar {
                width: 4px;
            }
            .scrollbar-thin::-webkit-scrollbar-track {
                background: theme('colors.dark');
            }
            .scrollbar-thin::-webkit-scrollbar-thumb {
                background: theme('colors.accent');
                border-radius: 2px;
            }
        }
    </style>
</head>
<body class="bg-secondary text-white font-inter h-screen flex overflow-hidden">
    <div class="flex flex-col md:flex-row h-full w-full">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-dark w-full md:w-16 lg:w-64 flex flex-col transition-all duration-300 ease-in-out z-20">
            <div class="p-4 flex items-center justify-center md:justify-start space-x-3 border-b border-gray-800">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold border-2 border-accent" style="background-color: #0D8ABC;">{{ nickname[0]|upper }}</div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-success rounded-full border-2 border-dark"></span>
                </div>
                <div class="hidden lg:block">
                    <h3 class="font-medium text-white">{{ nickname }}</h3>
                    <p class="text-xs text-muted">在线</p>
                </div>
            </div>
            
            <nav class="flex-1 overflow-y-auto scrollbar-thin py-4">
                <ul>
                    <li class="mb-1">
                        <a href="{{ url_for('main.index') }}" class="flex items-center justify-center md:justify-start px-4 py-3 text-muted hover:bg-card-hover hover:text-white transition-colors">
                            <i class="fas fa-home text-lg"></i>
                            <span class="hidden lg:block ml-3">返回控制台</span>
                        </a>
                    </li>
                </ul>
                
                <div class="mt-8 px-4 hidden lg:block">
                    <h4 class="text-xs uppercase text-muted font-semibold tracking-wider mb-3">在线用户</h4>
                    <div id="online-users-container" class="space-y-2">
                        <!-- Dynamic Users -->
                    </div>
                </div>
            </nav>
        </aside>
        
        <!-- Chat Area -->
        <div id="chat-content-container" class="flex-1 flex flex-col bg-secondary">
            <div class="bg-card border-b border-gray-800 p-4 flex items-center justify-between">
                <div class="flex items-center">
                    <div class="relative mr-3">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center text-white font-bold" style="background-color: #1A3A5F;">群</div>
                    </div>
                    <div>
                        <h3 class="font-medium text-white">公共聊天室</h3>
                        <p class="text-xs text-muted" id="online-count">0人在线</p>
                    </div>
                </div>
            </div>
            
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-6 scrollbar-thin">
                <div class="flex justify-center">
                    <span class="text-xs bg-dark text-muted px-3 py-1 rounded-full">欢迎加入聊天室</span>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="bg-card border-t border-gray-800 p-4">
                <div class="relative">
                    <!-- Mention List -->
                    <div id="mention-list" class="hidden absolute bottom-full left-0 mb-2 w-48 bg-card border border-gray-700 rounded-lg shadow-lg overflow-hidden z-50">
                        <ul class="text-sm text-gray-300">
                            <li class="px-4 py-2 hover:bg-accent hover:text-white cursor-pointer flex items-center space-x-2 transition-colors" data-value="@AI ">
                                <i class="fas fa-robot text-purple-500 w-5"></i>
                                <span>AI 助手</span>
                            </li>
                            <li class="px-4 py-2 hover:bg-accent hover:text-white cursor-pointer flex items-center space-x-2 transition-colors" data-value="@音乐 ">
                                <i class="fas fa-music text-orange-500 w-5"></i>
                                <span>点歌</span>
                            </li>
                            <li class="px-4 py-2 hover:bg-accent hover:text-white cursor-pointer flex items-center space-x-2 transition-colors" data-value="@天气 ">
                                <i class="fas fa-cloud-sun text-blue-500 w-5"></i>
                                <span>天气查询</span>
                            </li>
                            <li class="px-4 py-2 hover:bg-accent hover:text-white cursor-pointer flex items-center space-x-2 transition-colors" data-value="@电影 ">
                                <i class="fas fa-film text-pink-500 w-5"></i>
                                <span>影视推荐</span>
                            </li>
                            <li class="px-4 py-2 hover:bg-accent hover:text-white cursor-pointer flex items-center space-x-2 transition-colors" data-value="@AI 报表">
                                <i class="fas fa-chart-bar text-green-500 w-5"></i>
                                <span>数据报表</span>
                            </li>
                        </ul>
                    </div>

                    <input type="text" id="message-input" data-nickname="{{ nickname }}" placeholder="输入消息..." 
                           class="w-full bg-secondary border border-gray-700 rounded-lg py-3 px-4 pr-24 text-white focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent">
                    
                    <div class="absolute right-2 top-1/2 transform -translate-y-1/2 flex space-x-1">
                        <button id="ai-btn" class="bg-purple-600 hover:bg-purple-700 text-white p-2 rounded-lg transition-colors text-xs font-bold" title="@AI">
                            AI
                        </button>
                        <button id="send-btn" class="bg-accent hover:bg-accent/90 text-white p-2 rounded-lg transition-colors">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Notification -->
    <div id="notification" class="fixed top-4 right-4 bg-dark text-white px-4 py-2 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 z-50 flex items-center space-x-2">
        <i class="fas fa-bell"></i>
        <span id="notification-message"></span>
    </div>
    
    <script src="{{ url_for('chatroom.static', filename='js/chat_plugin.js') }}"></script>
</body>
</html>
